name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Yeh line sabse important hai – lockfile fix + fresh install
      - name: Clean install & regenerate lockfile if needed
        run: |
          rm -f package-lock.json
          npm install
          npm run build

      - name: Deploy to Hostinger KVM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.APP_DIR }}
            echo "Pulling latest code..."
            git reset --hard HEAD
            git pull origin main
            echo "Installing only production dependencies..."
            npm ci --omit=dev --ignore-scripts
            echo "Building Next.js app..."
            npm run build
            echo "Restarting with PM2..."
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js --update-env
            pm2 save
            echo "Deploy completed successfully!"
            pm2 status