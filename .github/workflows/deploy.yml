name: Deploy Frontend to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "=== Starting Frontend Deployment ==="
            # Initialize NVM and Node
            export NVM_DIR="/home/emergingfromthecave-di-web-dev/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22
            # Ensure PM2 uses correct home
            export PM2_HOME=/home/emergingfromthecave-di-web-dev/.pm2
            PM2_BIN="$NVM_DIR/versions/node/v22.21.1/bin/pm2"
            # Configure SSH for GitHub pulls
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
            chmod 600 ~/.ssh/id_ed25519_deploy
            cat > ~/.ssh/config << 'EOF'
            Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/id_ed25519_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking no
            EOF
            chmod 600 ~/.ssh/config
            # Go to app directory
            cd ${{ secrets.APP_DIR }}
            echo "Pulling latest code..."
            git reset --hard HEAD
            git pull origin main
            echo "Installing production dependencies..."
            npm ci --omit=dev
            echo "Building Next.js app..."
            npm run build
            echo "Restarting PM2..."
            $PM2_BIN reload di-web --update-env || $PM2_BIN start ecosystem.config.js
            $PM2_BIN save
            echo "Deployment successful!"
            # Cleanup SSH
            rm -f ~/.ssh/id_ed25519_deploy ~/.ssh/config
